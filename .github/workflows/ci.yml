name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wordrosco
          POSTGRES_PASSWORD: wordrosco_test
          POSTGRES_DB: wordrosco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @wordrosco/db generate
        env:
          DATABASE_URL: postgresql://wordrosco:wordrosco_test@localhost:5432/wordrosco_test

      - name: Run migrations
        run: pnpm --filter @wordrosco/db migrate:prod
        env:
          DATABASE_URL: postgresql://wordrosco:wordrosco_test@localhost:5432/wordrosco_test

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://wordrosco:wordrosco_test@localhost:5432/wordrosco_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-not-for-production
          NODE_ENV: test

      - name: Build
        run: pnpm build
